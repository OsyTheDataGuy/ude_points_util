name: Test fight rounds
on:
  pull_request:
    paths:
      - 'fight_rounds.*'
      - 'current_df.csv'
      - 'test_fight_rounds.py'
      - 'ude_scrape_new.py'
      - '.github/workflows/test_rounds.yml'
      - '.github/workflows/refresh_dataset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-data:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4==4.13.5
      - run: python -m unittest test_fight_rounds
      - run: python fight_rounds.py
      - run: git diff --exit-code -- fight_rounds.csv
